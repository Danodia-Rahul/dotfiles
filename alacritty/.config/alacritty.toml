#Checking some other


# alacritty.toml
# commented lines are the defaults
# man 5 alacritty (>0.13) for full config manual

#import = [
#"~/.config/alacritty/catpuccin-mocha.toml",
#"~/.config/alacritty/keybindings.toml",
#]


#working_directory     = "None"
#live_config_reload    = true
#ipc_socket            = true

[env]
TERM = "xterm-256color"

[window]
#dimensions            = { columns = 0, lines = 0 }
position = { x = 0, y = 0 }
padding = { x = 2, y = 2 }
#dynamic_padding       = true
decorations = "Full"
opacity = 0.99
blur = true
startup_mode = "Maximized"
title = "Alacritty"
dynamic_title = true
#class                 = { instance = "Alacritty", general = "Alacritty" }
decorations_theme_variant = "None"
#resize_increments     = false
#option_as_alt         = "None"


# [scrolling]
# history               = 65535
# #multiplier            = 3

[font]

normal = { family = "JetBrainsMonoNL Nerd Font", style = "Regular" }
#normal                = { family = "JetBrains Mono", style = "Medium" }
#normal = { family = "Drafting Mono", style = "Regular" }
#normal = { family = "Cascadia Code", style = "Regular" }
#normal = { family = "Adwaita Mono", style = "Regular" }
#normal                = { family = "C059", style = "Regular" }
#normal                = { family = "Fantasque Sans Mono", style = "Regular" }
#normal = { family = "Cascadia Code", style = "Regular" }
#normal                = { family = "Cascadia Code", style = "Regular" }
#normal                = { family = "CaskaydiaMono Nerd Font Mono", style = "Regular" }
#normal                = { family = "Courier Prime", style = "Regular" }
# bold                  = { family = "FantasqueSansMNerdFont Propo", style = "Bold" }
# italic                = { family = "FantasqueSansMNerdFont Propo", style = "Italic" }
# bold_italic           = { family = "FantasqueSansMNerdFont Propo", style = "Bold Italic" }
size = 18
# offset                = { x = 0, y = 0 }
# glyph_offset          = { x = 0, y = 0 }
builtin_box_drawing = true

[colors.primary]
background = "#282828" # A warmer, softer dark gray
foreground = "#dfbf8e" # A soft cream/parchment (much easier on eyes than pure white/gray)

[colors.normal]
black = "#282828"
red = "#ea6962"
green = "#a9b665"
yellow = "#d8a657"
blue = "#7daea3"
magenta = "#d3869b"
cyan = "#89b482"
white = "#dfbf8e"

[colors.bright]
black = "#928374"
red = "#ef938e"
green = "#bbc585"
yellow = "#e1bb7e"
blue = "#9dc2ba"
magenta = "#e1acbb"
cyan = "#a7c0a0"
white = "#dfbf8e"


# [colors]
# indexed_colors = [
#   { index = 16, color = "#FAB387" },
#   { index = 17, color = "#F5E0DC" },
# ]
#transparent_background_colors = false
# draw_bold_text_with_bright_colors = true

# [bell]
# animation             = "EaseOutExpo"
# duration              = 0
# color                 = "#C0C5CE"
# command               = { program = "notify-send", args = ["alacritty", "bell",] }

# [selection]
# #semantic_escape_chars = ",│‘|:"' ()[]{}<>t"
# save_to_clipboard     = true

[cursor.style]
shape = "Beam"
blinking = "On"

[cursor.vi_mode_style]
shape = "Block"
blinking = "Off"

[cursor]
blink_interval = 500
blink_timeout = 0
unfocused_hollow = false
thickness = 0.15

[terminal]
shell = { program = '/bin/zsh', args = ['-l'] }
#osc52                 = "OnlyCopy"

# [mouse]
# hide_when_typing      = true
# bindings = [
#   { mouse = "Middle", action = "PasteSelection" },
